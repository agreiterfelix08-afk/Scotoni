name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Build output is committed and up to date
        run: git diff --exit-code -- it de en index.html 404.html sitemap.xml robots.txt
      - run: npm run lint
      - run: npm test
